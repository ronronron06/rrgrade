name: keepalive
on:
  schedule: [{cron: '0 3 * * 1,4'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_activity" -H "apikey: ${{ secrets.SUPABASE_KEY }}" -H "Content-Type: application/json" -d '{"c":"ping"}'
